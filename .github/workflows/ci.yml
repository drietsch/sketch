name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      # Deliberately no `registry-url`: it makes setup-node write an .npmrc
      # containing _authToken=${NODE_AUTH_TOKEN}, which the npm CLI then prefers
      # over an OIDC token exchange, breaking trusted publishing with a
      # misleading E404. Kept consistent with release.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run verify:components
      # Build before typecheck: the dist test is typechecked against dist/.
      - run: pnpm run build
      - run: pnpm run verify:docs
      - run: pnpm run typecheck

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vitest refuses to write snapshots when CI=true (which Actions sets), so
      # a golden that was never committed fails here instead of passing silently.
      - run: pnpm exec vitest run --project unit --project lib --project backend --project determinism

      # Proves the published bundle behaves identically to the source it was
      # built from: a mis-resolved dependency or wrong target cannot pass here.
      - run: pnpm run build
      - run: pnpm run test:dist

  pages:
    name: Render example pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build

      # Loads every examples/ page in a real browser and asserts it renders
      # without a console or page error, that every scene node has a group, and
      # that seeking the timeline changes the DOM and seeking back restores it
      # byte-for-byte. Not pixel comparison -- it catches broken builds, missing
      # exports and silent render failures.
      - run: pnpm run verify:pages

  package:
    name: Verify published tarball
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: publint
        run: pnpm exec publint

      # esm-only: the package deliberately ships no `require` condition, so
      # attw's CJS-resolves-to-ESM finding is expected, not a defect.
      - name: Are the types wrong?
        run: pnpm exec attw --pack . --profile esm-only

      # Packs, installs into a throwaway project and runs it. publint and attw
      # both passed a build that shipped four unresolved bare imports, so this
      # is the gate that actually proves the package is installable.
      - name: Verify the installed package
        run: pnpm run verify:package

      - name: Assert nothing unwanted ships in the tarball
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map(f => f.path);
            console.log(files.join('\n'));
            const forbidden = ['src/', 'test/', 'examples/', 'docs/', 'vendor/', 'scripts/', '.github/',
                               'tsconfig.json', '.oxlintrc.json', 'pnpm-lock.yaml'];
            // The two agent-facing docs ship on purpose; the briefing and everything else under docs/ does not.
            const allowed = new Set(['docs/API.md', 'docs/for-agents.md']);
            const leaked = files.filter(f => !allowed.has(f) && forbidden.some(p => f.startsWith(p)));
            if (leaked.length) {
              console.error('::error::tarball contains: ' + leaked.join(', '));
              process.exit(1);
            }
          "
