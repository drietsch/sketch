<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sketch: text and icons</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Text and icons</h1>
    <p>The font (Grape Nuts, in capitals) at several sizes and weights, symbols, alignment, and every built-in icon.</p>
    <div id="out"></div>
    <script type="module">
      import { createDemo, iconNames } from '../dist/index.js';

      const demo = createDemo({ width: 960, height: 620, seed: 42 });
      // The weight ladder on the right is the same font gone round more times.
      const weights = createDemo({ width: 460, height: 260, seed: 42, background: null });
      let y = 16;
      for (const [i, size] of [12, 14, 18, 24, 36].entries()) {
        demo.text({ id: `t${size}`, x: 20, y, characters: `The quick brown fox ${size}px`, style: { fontSize: size } });
        weights.text({
          id: `w${size}`,
          x: 0,
          y,
          characters: `Weight ${[400, 500, 600, 700, 900][i]}`,
          style: { fontSize: size, fontWeight: [400, 500, 600, 700, 900][i] },
        });
        y += size * 1.6;
      }
      demo.text({
        id: 'symbols',
        x: 20,
        y,
        characters: '0123456789 !?@#$%&*()[]{}<>/\\ +-=_ "quoted" ‘single’ … – — éüßÀ €£',
        style: { fontSize: 18 },
      });
      y += 40;
      demo.text({ id: 'multi', x: 20, y, characters: 'Two lines\nof text', style: { fontSize: 16 } });
      demo.text({
        id: 'centered',
        x: 480,
        y,
        characters: 'centred',
        style: { fontSize: 16, textAlignHorizontal: 'CENTER', fills: [{ type: 'SOLID', color: '#2f6fed' }] },
      });
      demo.text({
        id: 'right',
        x: 940,
        y,
        characters: 'right-aligned',
        style: { fontSize: 16, textAlignHorizontal: 'RIGHT', fills: [{ type: 'SOLID', color: '#b00' }] },
      });
      y += 70;
      iconNames().forEach((name, i) => {
        const col = i % 16;
        const row = Math.floor(i / 16);
        demo.icon({ id: `icon-${name}`, x: 20 + col * 58, y: y + row * 58, icon: name, size: 28 });
      });
      y += Math.ceil(iconNames().length / 16) * 58;
      demo.icon({ id: 'big', x: 20, y, icon: 'house', size: 64 });
      demo.icon({
        id: 'rough',
        x: 100,
        y,
        icon: {
          nodes: [
            ['circle', { cx: 12, cy: 12, r: 10 }],
            ['path', { d: 'M8 12l3 3 5-6' }],
          ],
          rough: true,
        },
        size: 64,
        style: { fills: [{ type: 'SOLID', color: '#06a' }] },
      });
      demo.icon({
        id: 'plain',
        x: 180,
        y,
        icon: {
          nodes: [
            ['circle', { cx: 12, cy: 12, r: 10 }],
            ['path', { d: 'M8 12l3 3 5-6' }],
          ],
        },
        size: 64,
        style: { fills: [{ type: 'SOLID', color: '#06a' }] },
      });

      const out = document.getElementById('out');
      out.style.position = 'relative';
      out.innerHTML = demo.toSVG();
      // The weight ladder sits over the empty right half of the first document.
      const side = document.createElement('div');
      side.style.cssText = 'position:absolute;left:480px;top:0';
      side.innerHTML = weights.toSVG();
      out.appendChild(side);
      window.__demo = { demo, duration: 0, nodeIds: demo.scene.visible().map((n) => n.id), seek: () => {} };
    </script>
  </body>
</html>
