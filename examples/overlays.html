<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sketch: overlays</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #f4f4f6;
      }
    </style>
  </head>
  <body>
    <h1>Overlays</h1>
    <p>Menus, selects, popovers, dialogs, a drawer, toasts and a scroll area, all driven by the timeline.</p>
    <div id="out"></div>
    <script type="module">
      import { createDemo } from '../dist/index.js';

      const demo = createDemo({ width: 960, height: 720, seed: 11, background: null });
      demo.browser({ id: 'win', x: 20, y: 20, width: 920, height: 680, url: 'https://example.com/files' });

      // A menubar and a navigation menu along the top.
      demo.menubar({
        id: 'bar',
        parent: 'win',
        x: 16,
        y: 12,
        menus: [
          { label: 'File', items: ['New', 'Open…', '-', { label: 'Quit', icon: 'log-out' }] },
          {
            label: 'Edit',
            items: [
              { label: 'Cut', icon: 'copy' },
              { label: 'Copy', icon: 'copy' },
              'Paste',
              '-',
              { label: 'Undo', disabled: true },
            ],
          },
          { label: 'View', items: ['Zoom in', 'Zoom out'] },
        ],
      });
      demo.navigationMenu({
        id: 'nav',
        parent: 'win',
        x: 520,
        y: 12,
        items: [
          { label: 'Products', items: ['Editor', 'Player', 'Cloud'] },
          { label: 'Pricing' },
          { label: 'Docs', items: ['Guides', 'API'] },
        ],
      });

      // A toolbar: a menu button, a button with a tooltip, a share popover.
      demo.toolbar({ id: 'tools', parent: 'win', x: 16, y: 64, height: 48, layoutSizingHorizontal: 'HUG' });
      demo.menu({
        id: 'more',
        parent: 'tools',
        icon: 'menu',
        characters: 'Actions',
        items: [
          'Rename',
          'Duplicate',
          { label: 'Export', items: ['PDF', 'PNG', 'SVG'] },
          '-',
          { label: 'Delete', icon: 'x' },
        ],
      });
      demo.button({ id: 'save', parent: 'tools', characters: 'Save', icon: 'check', variant: 'primary' });
      demo.tooltip({ id: 'save-tip', anchor: 'save', characters: 'Saves to the cloud' });
      demo.button({ id: 'share', parent: 'tools', characters: 'Share', icon: 'send' });
      demo.popover({
        id: 'share-pop',
        anchor: 'share',
        title: 'Share this file',
        description: 'Anyone with the link can view.',
        width: 280,
      });
      demo.input({ id: 'share-email', parent: 'share-pop', width: 256, placeholder: 'name@example.com' });
      demo.button({ id: 'share-send', parent: 'share-pop', characters: 'Send invite', variant: 'primary' });
      demo.text({
        id: 'owner',
        parent: 'win',
        x: 420,
        y: 78,
        characters: 'Owned by @ada',
        style: { fills: [{ type: 'SOLID', color: '#2f6fed' }] },
      });
      demo.previewCard({
        id: 'ada-card',
        anchor: 'owner',
        title: 'Ada Lovelace',
        description: 'Analyst, metaphysician, and founder of scientific computing.',
      });

      // Selects.
      demo.select({
        id: 'country',
        parent: 'win',
        x: 16,
        y: 136,
        width: 200,
        options: ['Austria', 'Germany', 'Spain'],
        value: 'Austria',
      });
      demo.combobox({
        id: 'city',
        rightOf: 'country',
        gap: 16,
        width: 200,
        options: ['Berlin', 'Bern', 'Bristol', 'Vienna'],
        placeholder: 'City',
      });
      demo.autocomplete({
        id: 'search',
        rightOf: 'city',
        gap: 16,
        width: 220,
        options: ['Invoices', 'Inventory', 'Invitations', 'Reports'],
        placeholder: 'Search…',
      });

      // A scroll area of rows, with a context menu over it.
      demo.scrollArea({
        id: 'list',
        parent: 'win',
        x: 16,
        y: 200,
        width: 400,
        height: 220,
        contentHeight: 400,
        layoutMode: 'VERTICAL',
        padding: 12,
        itemSpacing: 8,
      });
      for (let i = 1; i <= 12; i++) demo.text({ id: `row-${i}`, parent: 'list', characters: `Document ${i}.pdf` });
      demo.contextMenu({
        id: 'ctx',
        anchor: 'list',
        items: ['Open', 'Rename', '-', { label: 'Move to trash', icon: 'x' }],
      });

      // Modals and notices. The buttons carry their own behaviour through
      // reactions, so the timeline only has to say what is clicked.
      demo.button({
        id: 'trash',
        parent: 'win',
        x: 440,
        y: 200,
        characters: 'Delete file',
        icon: 'x',
        reactions: [{ trigger: 'ON_CLICK', action: { target: 'confirm', open: true } }],
      });
      demo.dialog({
        id: 'confirm',
        title: 'Delete "Document 3.pdf"?',
        description: 'This moves the file to the trash. You can restore it within 30 days.',
        width: 400,
      });
      demo.toolbar({
        id: 'confirm-actions',
        parent: 'confirm',
        height: 48,
        layoutSizingHorizontal: 'FILL',
        primaryAxisAlignItems: 'MAX',
        fills: [],
        strokes: [],
      });
      demo.button({
        id: 'cancel',
        parent: 'confirm-actions',
        characters: 'Cancel',
        reactions: [{ trigger: 'ON_CLICK', action: { target: 'confirm', open: false } }],
      });
      demo.button({
        id: 'delete',
        parent: 'confirm-actions',
        characters: 'Delete',
        variant: 'primary',
        reactions: [{ trigger: 'ON_CLICK', action: { target: 'confirm', open: false } }],
      });
      demo.button({ id: 'prefs', rightOf: 'trash', gap: 12, characters: 'Settings', icon: 'settings' });
      demo.drawer({ id: 'settings', title: 'Settings' });
      demo.switch({ id: 'dark', parent: 'settings', characters: 'Dark mode' });
      demo.switch({ id: 'notify', parent: 'settings', characters: 'Notifications', checked: true });
      demo.toast({
        id: 'saved',
        title: 'Saved',
        description: 'All changes are in the cloud.',
        variant: 'success',
        open: false,
      });
      demo.toast({ id: 'offline', title: 'You are offline', variant: 'warning', stack: 1, open: false });

      demo.timeline
        .hover('save')
        .choose('country', 'Germany')
        .type('city', 'Ber')
        .choose('city', 'Berlin')
        .choose('bar', 'Edit')
        .choose('bar', 'Paste')
        .choose('nav', 'Products')
        .choose('nav', 'Cloud')
        .open('share-pop')
        .type('share-email', 'grace@example.com')
        .click('share-send')
        .close('share-pop')
        .hover('owner')
        .drag('list', 120)
        .open('ctx')
        .choose('ctx', 'Rename')
        .choose('more', 'PNG')
        .click('trash')
        .click('delete')
        .click('prefs')
        .open('settings')
        .toggle('dark')
        .close('settings')
        .open('saved')
        .wait(600)
        .open('offline')
        .wait(1200);

      const player = demo.mount(document.getElementById('out'), { loop: true, autoplay: true });
      window.__demo = {
        demo,
        player,
        duration: player.duration,
        nodeIds: demo.scene.visible().map((n) => n.id),
        seek: (t) => {
          player.pause();
          player.seek(t);
        },
      };
    </script>
  </body>
</html>
