<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sketch: login form</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #f4f4f6;
      }
    </style>
  </head>
  <body>
    <h1>Login form</h1>
    <p>
      The briefing's example: a browser window with a panel, inputs, a primary button, and component states. Everything
      in the card is placed relative to its neighbour.
    </p>
    <div id="out"></div>
    <script type="module">
      import { createDemo } from '../dist/index.js';

      const demo = createDemo({ width: 900, height: 600, seed: 42, background: null });
      demo.browser({ id: 'browser', x: 40, y: 30, width: 820, height: 540, url: 'https://example.com/login' });
      demo.frame({ id: 'card', parent: 'browser', x: 210, y: 70, width: 400, height: 330, title: 'Welcome back' });

      // Inside the card, only the first node has coordinates; the rest are
      // placed relative to their neighbour and inherit the card as parent.
      demo.text({
        id: 'email-label',
        parent: 'card',
        x: 24,
        y: 20,
        characters: 'Email',
        style: { fills: [{ type: 'SOLID', color: '#8a8f98' }] },
      });
      demo.input({ id: 'email', below: 'email-label', gap: 10, width: 352, placeholder: 'you@example.com' });
      demo.text({
        id: 'password-label',
        below: 'email',
        gap: 20,
        characters: 'Password',
        style: { fills: [{ type: 'SOLID', color: '#8a8f98' }] },
      });
      demo.input({
        id: 'password',
        below: 'password-label',
        gap: 10,
        width: 352,
        value: 'hunter2',
        state: { focused: true },
      });
      demo.button({
        id: 'login',
        below: 'password',
        gap: 30,
        width: 352,
        characters: 'Sign in',
        variant: 'primary',
        icon: 'log-in',
      });
      demo.button({ id: 'forgot', below: 'login', gap: 14, characters: 'Forgot password?' });
      demo.button({ id: 'hovered', rightOf: 'forgot', gap: 12, characters: 'Hovered', state: { hovered: true } });
      demo.button({ id: 'pressed', rightOf: 'hovered', gap: 12, characters: 'Pressed', state: { pressed: true } });

      demo.icon({
        id: 'help',
        parent: 'browser',
        x: 780,
        y: 20,
        icon: 'info',
        size: 22,
        strokes: [{ type: 'SOLID', color: '#8a8f98' }],
      });
      demo.button({
        id: 'disabled',
        parent: 'browser',
        x: 40,
        y: 440,
        characters: 'Disabled',
        state: { disabled: true },
      });
      demo.button({
        id: 'long',
        rightOf: 'disabled',
        gap: 16,
        characters: 'A button with a longer label',
        icon: 'download',
      });

      document.getElementById('out').innerHTML = demo.toSVG();
      window.__demo = { demo, duration: 0, nodeIds: demo.scene.visible().map((n) => n.id), seek: () => {} };
    </script>
  </body>
</html>
