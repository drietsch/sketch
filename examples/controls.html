<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sketch: controls</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #f4f4f6;
      }
    </style>
  </head>
  <body>
    <h1>Controls</h1>
    <p>Every in-place control in its states, then a form built from fields and driven by semantic steps.</p>
    <div id="out"></div>
    <script type="module">
      import { createDemo } from '../dist/index.js';

      const demo = createDemo({ width: 960, height: 760, seed: 7, background: null });
      demo.frame({ id: 'sheet', x: 20, y: 20, width: 920, height: 720, title: 'Controls' });

      // Column one: toggles.
      demo.checkbox({ id: 'cb-off', parent: 'sheet', x: 24, y: 20, characters: 'Unchecked' });
      demo.checkbox({ id: 'cb-on', below: 'cb-off', gap: 12, characters: 'Checked', checked: true });
      demo.checkbox({
        id: 'cb-ind',
        below: 'cb-on',
        gap: 12,
        characters: 'Some of these',
        checked: true,
        indeterminate: true,
      });
      demo.switch({ id: 'sw-off', below: 'cb-ind', gap: 16, characters: 'Notifications' });
      demo.switch({ id: 'sw-on', below: 'sw-off', gap: 12, characters: 'Dark mode', checked: true });
      demo.toggle({ id: 'tg', below: 'sw-on', gap: 16, characters: 'Bold', icon: 'pencil' });
      demo.toggle({ id: 'tg-on', rightOf: 'tg', gap: 8, characters: 'Italic', pressed: true });
      demo.toggleGroup({ id: 'align', below: 'tg', gap: 16, options: ['Left', 'Center', 'Right'], value: 'Center' });
      demo.radioGroup({ id: 'plan', below: 'align', gap: 16, options: ['Free', 'Pro', 'Team'], value: 'Pro' });
      demo.checkboxGroup({
        id: 'toppings',
        below: 'plan',
        gap: 16,
        options: ['Cheese', 'Olives', 'Basil'],
        value: ['Cheese', 'Basil'],
        orientation: 'horizontal',
      });

      // Column two: values.
      demo.slider({ id: 'volume', parent: 'sheet', x: 340, y: 20, width: 240, value: 35 });
      demo.slider({ id: 'brightness', below: 'volume', gap: 16, width: 240, value: 80, min: 0, max: 100, step: 5 });
      demo.progress({ id: 'upload', below: 'brightness', gap: 24, width: 240, value: 62, characters: 'Uploading 62%' });
      demo.progress({ id: 'busy', below: 'upload', gap: 12, width: 240, indeterminate: true, characters: 'Working…' });
      demo.meter({ id: 'disk', below: 'busy', gap: 12, width: 240, value: 78, characters: 'Disk 78% full' });
      demo.separator({ id: 'sep', below: 'disk', gap: 16, length: 240 });
      demo.avatar({ id: 'av1', below: 'sep', gap: 16, characters: 'Ada' });
      demo.avatar({ id: 'av2', rightOf: 'av1', gap: 10, icon: 'user' });
      demo.avatar({
        id: 'av3',
        rightOf: 'av2',
        gap: 10,
        characters: 'JS',
        size: 48,
        fills: [{ type: 'SOLID', color: '#ffd166' }],
        sketch: { fillStyle: 'solid' },
      });
      demo.numberField({ id: 'qty', below: 'av1', gap: 20, width: 160, value: 2, min: 0, max: 10 });
      demo.otpField({ id: 'otp', below: 'qty', gap: 16, value: '4921', state: { focused: true } });

      // Column three: containers.
      demo.tabs({
        id: 'tabs',
        parent: 'sheet',
        x: 640,
        y: 20,
        width: 250,
        height: 150,
        tabs: ['General', 'Billing', 'Team'],
        value: 'Billing',
      });
      demo.text({ id: 'general', parent: 'tabs', x: 0, y: 12, characters: 'General settings' });
      demo.text({ id: 'billing', parent: 'tabs', x: 0, y: 12, characters: 'Billing details' });
      demo.text({ id: 'team', parent: 'tabs', x: 0, y: 12, characters: 'Team members' });
      demo.accordion({
        id: 'faq',
        below: 'tabs',
        gap: 16,
        width: 250,
        items: [
          { label: 'Shipping', characters: 'Ships in 2 days.' },
          { label: 'Returns', characters: 'Within 30 days.' },
          'Warranty',
        ],
        value: 'Returns',
      });
      demo.collapsible({
        id: 'advanced',
        below: 'faq',
        gap: 16,
        width: 250,
        characters: 'Advanced options',
        open: true,
        padding: 12,
      });
      demo.checkbox({ id: 'adv-1', parent: 'advanced', characters: 'Enable beta features' });
      demo.checkbox({ id: 'adv-2', parent: 'advanced', characters: 'Verbose logging' });
      demo.toolbar({ id: 'tools', below: 'advanced', gap: 16, height: 48, layoutSizingHorizontal: 'HUG' });
      demo.toggle({ id: 't-b', parent: 'tools', icon: 'pencil' });
      demo.toggle({ id: 't-i', parent: 'tools', icon: 'link' });
      demo.separator({ id: 't-sep', parent: 'tools', orientation: 'vertical', length: 24 });
      demo.button({ id: 't-save', parent: 'tools', characters: 'Save' });

      // A form of fields with auto-layout.
      demo.form({ id: 'signup', parent: 'sheet', x: 24, y: 470, width: 300, layoutSizingVertical: 'HUG' });
      demo.field({ id: 'f-name', parent: 'signup', label: 'Name', width: 300 });
      demo.input({ id: 'name', parent: 'f-name', width: 300, placeholder: 'Ada Lovelace' });
      demo.field({ id: 'f-email', parent: 'signup', label: 'Email', description: 'We never share it.', width: 300 });
      demo.input({ id: 'email', parent: 'f-email', width: 300, placeholder: 'ada@example.com' });
      demo.fieldset({ id: 'fs', parent: 'sheet', x: 340, y: 470, width: 240, height: 120, legend: 'Contact' });
      demo.checkbox({ id: 'fs-1', parent: 'fs', x: 16, y: 16, characters: 'Email me' });
      demo.checkbox({ id: 'fs-2', below: 'fs-1', gap: 12, characters: 'Text me', checked: true });

      demo.timeline
        .check('cb-off')
        .uncheck('cb-on')
        .toggle('sw-off')
        .choose('plan', 'Team')
        .check('toppings', 'Olives')
        .choose('align', 'Right')
        .drag('volume', 90)
        .choose('qty', 5)
        .choose('tabs', 'Team')
        .choose('faq', 'Warranty')
        .close('advanced')
        .click('name')
        .type('name', 'Ada')
        .wait(600);

      const player = demo.mount(document.getElementById('out'), { loop: true, autoplay: true });
      window.__demo = {
        demo,
        player,
        duration: player.duration,
        nodeIds: demo.scene.visible().map((n) => n.id),
        seek: (t) => {
          player.pause();
          player.seek(t);
        },
      };
    </script>
  </body>
</html>
