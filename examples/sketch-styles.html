<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sketch: sketch styles</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Sketch styles</h1>
    <p>Every fill style, a rounded rectangle, an ellipse, a dashed line, a path, and a nested group.</p>
    <div id="out"></div>
    <script type="module">
      import { createDemo } from '../dist/index.js';

      const demo = createDemo({ width: 900, height: 400, seed: 42 });
      const styles = ['hachure', 'solid', 'zigzag', 'cross-hatch', 'dots', 'dashed', 'zigzag-line'];
      styles.forEach((fillStyle, i) => {
        demo.rectangle({
          id: `fill-${fillStyle}`,
          x: 20 + i * 125,
          y: 20,
          width: 100,
          height: 80,
          fills: [{ type: 'SOLID', color: '#7aa2f7' }],
          sketch: { fillStyle },
        });
      });
      demo.rectangle({
        id: 'rounded',
        x: 20,
        y: 140,
        width: 220,
        height: 100,
        cornerRadius: 16,
        strokes: [{ type: 'SOLID', color: '#b00' }],
        strokeWeight: 2,
      });
      demo.ellipse({
        id: 'ellipse',
        x: 270,
        y: 140,
        width: 160,
        height: 100,
        fills: [{ type: 'SOLID', color: '#ffd166' }],
        sketch: { fillStyle: 'solid' },
      });
      demo.line({ id: 'line', x: 460, y: 140, x2: 870, y2: 240, strokeDashes: [8, 6] });
      demo.vector({
        id: 'triangle',
        x: 20,
        y: 270,
        d: 'M0 100 L60 0 L120 100 Z',
        fills: [{ type: 'SOLID', color: '#06d6a0' }],
      });
      demo.rectangle({ id: 'group', x: 180, y: 270, width: 400, height: 110, sketch: { roughness: 0.5 } });
      demo.rectangle({ id: 'child', parent: 'group', x: 16, y: 16, width: 120, height: 70 });
      demo.ellipse({ id: 'grandchild', parent: 'child', x: 30, y: 15, width: 40, height: 40, sketchVariant: 3 });

      const out = document.getElementById('out');
      out.innerHTML = demo.toSVG();

      window.__demo = {
        demo,
        duration: 0,
        nodeIds: demo.scene.visible().map((n) => n.id),
        seek: () => {},
      };
    </script>
  </body>
</html>
